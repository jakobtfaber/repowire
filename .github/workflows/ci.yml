name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uvx ruff check repowire/

      - name: Type check
        run: uv run ty check repowire/

      - name: Test
        run: uv run pytest

  go-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon-go/go.mod
          cache-dependency-path: daemon-go/go.sum

      - name: Vet, build, test
        run: cd daemon-go && go vet ./... && go build ./... && go test ./...

      - name: Cross-compile all release targets (no cgo)
        run: |
          cd daemon-go
          for p in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS=${p%/*} GOARCH=${p#*/} go build -o /dev/null . \
              && echo "ok $p" || exit 1
          done
